<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="Author" lang="uk" content="Квятківський Ілля Юрійович">
    <meta name="Keywords" content="Web - Форми">
    <title>Лабораторна робота №6</title>
</head>
<body>
    <svg version="1.1" 
       baseProfile="full"
       xmlns="http://www.w3.org/2000/svg"
       xmlns:xlink="http://www.w3.org/1999/xlink"
       width="660px" 
       height="430px" 
       viewBox="0 0 660 430">
    <desc>Варіант 7</desc>

    <defs>
      <symbol id="sq" viewBox="0 0 60 60" width="60" height="60">
        <rect x="0" y="0" width="60" height="60" fill="blue" stroke="black" stroke-width="1"/>
      </symbol>
      <path id="curve" d="M 40,90 Q 330,-10 620,90" fill="none"/>
    </defs>
 
    <use xlink:href="#curve" stroke="lightgray" stroke-width="1"/>
    <text font-family="Times New Roman, serif" font-size="26" fill="darkred">
      <textPath xlink:href="#curve" startOffset="20">Лабораторна номер 6</textPath>
    </text>
 
    <g transform="translate(0,70)">
 
      <g id="shapes" fill="blue" stroke="black" stroke-width="1">
 
        <ellipse cx="380" cy="160" rx="120" ry="60">
          <animate attributeName="fill"
          values="blue;red;yellow;green;blue"
          dur="6s" 
          repeatCount="indefinite"/>
        </ellipse>
 
        <g transform="translate(320 280)">
          <g>
            <animateTransform 
            attributeName="transform" 
            type="scale"
            values="1;1.3;0.7;1"
            dur="4s" 
            repeatCount="indefinite"/>
            <circle cx="0" cy="0" r="60"/>
          </g>
        </g>
 
        <circle cx="440" cy="280" r="60"/>
        <rect x="320" y="340" width="120" height="60"/>
      </g>
 
      <g id="squares">
        <use xlink:href="#sq" x="440" y="40"/>
        <use xlink:href="#sq" x="500" y="100"/>
        <use xlink:href="#sq" x="200" y="280"/>
      </g>
 
      <g>
        <animateTransform 
        attributeName="transform" 
        type="translate"
        values="0 0; 80 0; 0 0"
        dur="3s" 
        repeatCount="indefinite"/>
        <use xlink:href="#sq" x="500" y="280"/>
      </g>

      <g transform="translate(290 70)">
        <g>
          <animateTransform 
          attributeName="transform" 
          type="rotate"
          from="0" 
          to="360"
          dur="5s" 
          repeatCount="indefinite"/>
          <use xlink:href="#sq" x="-30" y="-30"/>
        </g>
      </g>

      <g transform="translate(230 130)">
        <g>
          <animateTransform 
          attributeName="transform" 
          type="skewX"
          values="0; 30; -30; 0"
          dur="4s" 
          repeatCount="indefinite"/>
          <use xlink:href="#sq" x="-30" y="-30"/>
        </g>
      </g>
 
      <g id="axes" stroke="black" stroke-width="1.5" fill="black">
        <line x1="40" y1="220" x2="610" y2="220"/>
        <polygon points="615 600 600"/>
        <line x1="200" y1="410" x2="200" y2="15"/>
        <polygon points="200 200 200"/>
      </g>
 
      <g id="ticks" stroke="black" stroke-width="1">
        <polyline points="260 260"/>
        <polyline points="380 380"/>
        <polyline points="500 500"/>
        <polyline points="185 215"/>
        <polyline points="185 215"/>
        <polyline points="185 215"/>
        <polyline points="185 215"/>
      </g>
 
      <g id="labels" font-family="Times New Roman, serif" font-size="22" fill="black">
        <text x="220" y="30">Y</text>
        <text x="625" y="245">X</text>
        <text x="180" y="245" text-anchor="end">0</text>
        <text x="260" y="245">1</text>
        <text x="320" y="245">2</text>
        <text x="400" y="245">3</text>
        <text x="430" y="245">4</text>
        <text x="500" y="245">5</text>
        <text x="180" y="170" text-anchor="end">1</text>
        <text x="180" y="110" text-anchor="end">2</text>
        <text x="180" y="290" text-anchor="end">-1</text>
        <text x="180" y="350" text-anchor="end">-2</text>
      </g>
    </g>
  </svg>
</body>
</html>
